---
- name: Deploy Student Management System to AKS
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Deploy MySQL to Kubernetes
      command: kubectl apply -f "{{ playbook_dir }}/../k8s/mysql.yaml"

    - name: Wait for MySQL deployment
      command: kubectl rollout status deployment/mysql --timeout=180s

    - name: Deploy Student Management application
      command: kubectl apply -f "{{ playbook_dir }}/../k8s/app.yaml"

    - name: Wait for application deployment
      command: kubectl rollout status deployment/student-management --timeout=180s

    - name: Display Kubernetes resources
      command: kubectl get pods,services
      register: deployment_status

    - name: Show deployment status
      debug:
        var: deployment_status.stdout_lines
